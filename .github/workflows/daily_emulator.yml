name: Android Emulator Tests

on:
  # Automatic triggers disabled for this demo project; run manually via workflow_dispatch.
  # schedule:
  #   # daily (21:00 UTC)
  #   - cron: "0 21 * * *"
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level for the emulator
        required: true
        default: "34"
      spec_path:
        description: "Spec glob to run (default: all specs)"
        required: false
        default: "tests/specs/**/*.ts"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

env:
  APP_URL: https://github.com/webdriverio/native-demo-app/releases/download/v2.0.0/android.wdio.native.app.v2.0.0.apk

jobs:
  emulator-test:
    name: Android Emulator (local Appium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      API_LEVEL: ${{ github.event.inputs.api_level || '34' }}
      SPEC_PATH: ${{ github.event.inputs.spec_path || 'tests/specs/**/*.ts' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner doesn't have enough free space for the emulator's userdata partition.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download test APK
        run: |
          mkdir -p tests/apps
          curl -fsSL -o tests/apps/wdio-demo.apk "$APP_URL"
          ls -la tests/apps

      - name: Start Appium
        run: |
          npm run appium > appium.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4723/status && break; sleep 2; done

      - name: Run tests on Android emulator
        id: run_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6144M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2
          disable-animations: true
          script: npm run test:android -- --spec "${{ env.SPEC_PATH }}"

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-${{ github.run_number }}
          path: appium.log
          retention-days: 3

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Write test summary
        if: always()
        run: |
          node -e '
            const s = require("./allure-report/widgets/summary.json").statistic;
            const rows = ["total", "passed", "failed", "broken", "skipped"].map((k) => `| ${k} | ${s[k]} |`);
            console.log(["### Android Emulator", "| Result | Count |", "|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark workflow failed if tests failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1
