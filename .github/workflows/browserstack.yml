name: BrowserStack Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select mobile platform to run tests on
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
      spec_path:
        description: "Spec glob to run (default: all specs)"
        required: false
        default: "tests/specs/**/*.ts"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  test:
    name: BrowserStack ${{ github.event.inputs.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PLATFORM: ${{ github.event.inputs.platform }}
      SPEC_PATH: ${{ github.event.inputs.spec_path }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      ANDROID_APP_URL: https://github.com/webdriverio/native-demo-app/releases/download/v2.0.0/android.wdio.native.app.v2.0.0.apk
      # BrowserStack runs iOS on real devices, which need a signed .ipa build.
      IOS_APP_URL: ${{ vars.IOS_IPA_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "Missing BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY secrets"
            exit 1
          fi
          if [ "$PLATFORM" = "ios" ] && [ -z "$IOS_APP_URL" ]; then
            echo "Missing IOS_IPA_URL repository variable (a link to a real-device .ipa)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Upload app to BrowserStack
        run: |
          APP_URL=$([ "$PLATFORM" = "ios" ] && echo "$IOS_APP_URL" || echo "$ANDROID_APP_URL")
          APP_ID=$(curl -fsS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "url=$APP_URL" | jq -r '.app_url')
          echo "Uploaded app: $APP_ID"
          echo "BROWSERSTACK_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Run WDIO tests on BrowserStack
        id: run_tests
        continue-on-error: true
        run: npm run test:$PLATFORM:bs -- --spec "$SPEC_PATH"

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Write test summary
        if: always()
        run: |
          node -e '
            const s = require("./allure-report/widgets/summary.json").statistic;
            const rows = ["total", "passed", "failed", "broken", "skipped"].map((k) => `| ${k} | ${s[k]} |`);
            console.log([`### BrowserStack ${process.env.PLATFORM}`, "| Result | Count |", "|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
          echo "Session videos: https://app-automate.browserstack.com/dashboard/v2" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark workflow failed if tests failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1
